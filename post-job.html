<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | CODIORA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container { max-width: 700px; margin: 30px auto; padding: 25px; }
        .job-form { background: white; border: 1px solid #ddd; padding: 25px; border-radius: 12px; }
        .job-form input, .job-form select, .job-form textarea {
            width: 100%; padding: 12px; margin: 8px 0 16px;
            border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        .btn { background: #5138a8; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; }
        #message { margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>CODIORA</h1>
        <p>Our Code Builds Your Vision</p>
        <nav>
            <a href="index.html">Home</a> |
            <a href="find-jobs.html">Find Jobs</a> |
            <a href="my-proposals.html">My Proposals</a>
        </nav>
    </header>

    <main class="form-container">
        <h1>Post a Job</h1>
        <p>Describe your project to find the right freelancer.</p>

        <form class="job-form" id="postJobForm">
            <label for="title">Job Title</label>
            <input type="text" id="title" required placeholder="e.g. Website Developer">

            <label for="description">Job Description</label>
            <textarea id="description" rows="5" required placeholder="Describe your project"></textarea>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select a category</option>
                <option>Web Development</option>
                <option>Graphic Design</option>
                <option>Content Writing</option>
            </select>

            <label for="budget">Budget ($)</label>
            <input type="number" id="budget" min="1" required placeholder="Enter your budget">

            <label for="skills">Required Skills</label>
            <input type="text" id="skills" required placeholder="HTML, CSS, JavaScript">

            <label for="deadline">Deadline</label>
            <input type="date" id="deadline" required>

            <button type="submit" class="btn">Post Job</button>
            <p id="message" role="status"></p>
        </form>
    </main>

    <script>
        const postForm = document.getElementById("postJobForm");

        document.getElementById("deadline").min =
            new Date().toLocaleDateString("en-CA");

        postForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const budget = Number(document.getElementById("budget").value);
            const deadline = document.getElementById("deadline").value;
            const message = document.getElementById("message");

            if (!title || !description || !budget || budget <= 0 || !deadline) {
                message.style.color = "red";
                message.textContent = "Please enter valid information in all fields.";
                return;
            }

            if (deadline < new Date().toLocaleDateString("en-CA")) {
                message.style.color = "red";
                message.textContent = "Please select today or a future deadline.";
                return;
            }

            message.style.color = "green";
            message.textContent = "Job posted successfully! (Demo only)";
            postForm.reset();
        });
    </script>
</body>
</html>
