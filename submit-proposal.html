<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Proposal | CODIORA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container { max-width: 700px; margin: 30px auto; padding: 25px; }
        .proposal-form { background: white; border: 1px solid #ddd; padding: 25px; border-radius: 12px; }
        .proposal-form input, .proposal-form textarea {
            width: 100%; padding: 12px; margin: 8px 0 16px;
            border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        .btn { background: #5138a8; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; }
        #message { margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>CODIORA</h1>
        <p>Our Code Builds Your Vision</p>
        <nav>
            <a href="index.html">Home</a> |
            <a href="find-jobs.html">Find Jobs</a> |
            <a href="job-details.html">Job Details</a> |
            <a href="my-proposals.html">My Proposals</a>
        </nav>
    </header>

    <main class="form-container">
        <h1>Submit Your Proposal</h1>
        <p>Tell the client why you are suitable for this project.</p>

        <form class="proposal-form" id="proposalForm">
            <label for="name">Your Name</label>
            <input type="text" id="name" required placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="example@email.com">

            <label for="price">Proposed Price ($)</label>
            <input type="number" id="price" min="1" required placeholder="Enter your price">

            <label for="delivery">Delivery Time (Days)</label>
            <input type="number" id="delivery" min="1" required placeholder="Number of days">

            <label for="skills">Relevant Skills / Experience</label>
            <textarea id="skills" rows="3" required placeholder="Describe your relevant skills"></textarea>

            <label for="proposal">Proposal Message</label>
            <textarea id="proposal" rows="5" required placeholder="Explain how you will complete the project"></textarea>

            <button type="submit" class="btn">Submit Proposal</button>
            <p id="message" role="status"></p>
        </form>
    </main>

    <script>
        const proposalForm = document.getElementById("proposalForm");

        proposalForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const price = Number(document.getElementById("price").value);
            const delivery = Number(document.getElementById("delivery").value);
            const skills = document.getElementById("skills").value.trim();
            const proposal = document.getElementById("proposal").value.trim();
            const message = document.getElementById("message");

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!name || !emailPattern.test(email) ||
                price <= 0 || delivery <= 0 ||
                !skills || !proposal) {
                message.style.color = "red";
                message.textContent = "Please fill all fields with valid information.";
                return;
            }

            const proposals = JSON.parse(
                localStorage.getItem("codioraProposals") || "[]"
            );

            proposals.push({
                name: name,
                email: email,
                price: price,
                delivery: delivery,
                skills: skills,
                proposal: proposal,
                status: "Pending"
            });

            localStorage.setItem("codioraProposals", JSON.stringify(proposals));

            message.style.color = "green";
            message.textContent = "Proposal submitted successfully!";
            proposalForm.reset();
        });
    </script>
</body>
</html>
